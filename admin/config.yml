backend:
  name: github
  repo: Guilhermehenrique777/mesq2026
  branch: main
  # OAuth roda nas Functions do próprio Cloudflare Pages (ver /functions/api)
  base_url: https://mesqfit.com.br
  auth_endpoint: api/auth

# publica direto na branch main — sem fluxo de rascunho/aprovação
publish_mode: simple

media_folder: midias
public_folder: midias

locale: pt

collections:
  - name: catalogo
    label: Catálogo
    icon: shopping_bag
    files:
      - name: conteudo
        label: Kits, preços e fotos
        file: data/conteudo.json
        description: >
          Tudo o que aparece no site. Cada seção tem seus kits;
          cada kit tem preço, descrição, cor e fotos/vídeos.
        fields:
          - name: site
            label: Ajustes gerais
            widget: object
            collapsed: true
            fields:
              - name: whatsapp
                label: WhatsApp que recebe os pedidos
                hint: Só números, com 55 e DDD. Ex.- 5511966050632
                widget: string
                pattern: ['^55\d{10,11}$', 'Use o formato 5511999999999 (só números)']
              - name: freteTexto
                label: Frase do frete
                widget: string

          - name: secoes
            label: Seções
            label_singular: seção
            widget: list
            summary: '{{fields.titulo}}'
            fields:
              - name: id
                label: Identificador
                hint: Não mexer. É o que liga a seção ao layout do site.
                widget: select
                options: [kits, kits2]
              - name: titulo
                label: Título da seção
                widget: string

              - name: kits
                label: Kits
                label_singular: kit
                widget: list
                summary: '{{fields.nome}} — {{fields.precoPix}}'
                fields:
                  - name: id
                    label: Identificador
                    hint: Só letras minúsculas, sem espaço nem acento. Ex.- esmeralda
                    widget: string
                    pattern: ['^[a-z0-9-]+$', 'Só letras minúsculas, números e hífen']
                  - name: rotulo
                    label: Nome curto (aparece no botão)
                    widget: string
                  - name: nome
                    label: Nome completo
                    widget: string
                  - name: desc
                    label: Descrição
                    widget: text

                  - name: cor
                    label: Cor do kit
                    hint: O fundo da seção e a cor dos botões saem daqui.
                    widget: color
                    enable_alpha: false

                  - name: precoPix
                    label: Preço no PIX
                    hint: 'Escreva assim- R$ 179,90'
                    widget: string
                    pattern: ['^R\$ \d{1,3}(\.\d{3})*,\d{2}$', 'Escreva no formato R$ 179,90']
                  - name: preco3x
                    label: Valor de CADA parcela no cartão (3×)
                    hint: >
                      Atenção- é o valor de UMA parcela, não o total.
                      O site multiplica por 3 sozinho.
                    widget: string
                    pattern: ['^R\$ \d{1,3}(\.\d{3})*,\d{2}$', 'Escreva no formato R$ 71,66']

                  - name: tamanhos
                    label: Tamanhos disponíveis
                    widget: list
                    field: { name: tamanho, label: Tamanho, widget: string }

                  - name: midias
                    label: Fotos e vídeos
                    label_singular: foto/vídeo
                    hint: A ordem aqui é a ordem em que aparecem na pilha.
                    widget: list
                    summary: '{{fields.tipo}} — {{fields.src}}'
                    fields:
                      - name: tipo
                        label: Tipo
                        widget: select
                        options:
                          - { label: Foto, value: img }
                          - { label: Vídeo, value: video }
                        default: img
                      - name: src
                        label: Arquivo
                        widget: file
                        media_library: { config: { max_file_size: 15728640 } }
                      - name: comAudio
                        label: Vídeo com som (mostra o botão de áudio)
                        widget: boolean
                        default: false
                        required: false

                  - name: frases
                    label: Frases do letreiro
                    hint: Giram uma a uma em cima da foto.
                    widget: list
                    field: { name: frase, label: Frase, widget: string }

                  - name: pulso
                    label: Botão pisca pra chamar atenção
                    widget: boolean
                    default: true
                    required: false

                  - name: cores
                    label: Ajuste fino de cores (opcional)
                    hint: >
                      Deixe vazio que o site calcula tudo a partir da "Cor do kit".
                      Só preencha se quiser um tom específico.
                    widget: object
                    collapsed: true
                    required: false
                    fields:
                      - { name: fundo, label: Fundo da seção, widget: color, required: false, enable_alpha: false }
                      - { name: tab, label: Botão do kit, widget: color, required: false, enable_alpha: false }
                      - { name: letreiro, label: Letreiro, widget: color, required: false, enable_alpha: false }
                      - { name: drawerAccent, label: Destaque do pedido, widget: color, required: false, enable_alpha: false }
